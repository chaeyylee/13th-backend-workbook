name: Deploy to EC2

# develop 브랜치에 push될 때 Workflow가 실행돼요
on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    # GitHub이 제공하는 Ubuntu 서버에서 실행해요
    runs-on: ubuntu-latest

    steps:
      # 1. 레포의 코드를 Runner로 가져와요
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17을 설치해요
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 빌드 권한을 부여하고 .jar를 빌드해요
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub에 로그인해요
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지를 빌드하고 Docker Hub에 push해요
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # latest 태그와 커밋 SHA 태그를 동시에 붙여요
          # SHA 태그 덕분에 특정 커밋의 이미지로 언제든 롤백할 수 있어요
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/workbook:latest
            ${{ secrets.DOCKER_USERNAME }}/workbook:${{ github.sha }}

      # 6. EC2에 SSH로 접속해서 새 이미지를 pull 받고 컨테이너를 재시작해요
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 환경 변수를 현재 세션에서 쓸 수 있게 불러와요
            source ~/.bashrc

            # Docker Hub에서 최신 이미지를 pull 받아요
            docker pull ${{ secrets.DOCKER_USERNAME }}/workbook:latest

            # 기존 컨테이너를 내리고 새 이미지로 다시 올려요
            # docker compose는 docker-compose.yml 파일을 자동으로 찾아요
            docker compose -f ~/docker-compose.yml down
            docker compose -f ~/docker-compose.yml up -d

            # 사용하지 않는 이전 이미지를 삭제해서 디스크를 정리해요
            docker image prune -f