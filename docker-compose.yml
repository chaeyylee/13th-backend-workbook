services:
  app:
    # Docker Hub에서 pull 받을 이미지 이름이에요. 본인 아이디로 바꿔주세요
    image: chaeyylee/workbook:latest

    # 호스트의 8080 포트를 컨테이너의 8080 포트로 연결해요
    # 형식: "호스트포트:컨테이너포트"
    ports:
      - "8080:8080"

    # 컨테이너에 환경 변수를 주입해요
    # application-prod.yml에서 ${SWAGGER_TITLE}로 읽어가는 값들이에요
    environment:
      - SWAGGER_TITLE=${SWAGGER_TITLE}
      - SWAGGER_DESCRIPTION=${SWAGGER_DESCRIPTION}

    # 컨테이너가 죽거나 EC2가 재부팅됐을 때 자동으로 다시 시작해요
    restart: always